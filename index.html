<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="description" content="Mucha Tarot · 抽三张牌，看见过去、现在与未来。内置 78 张公版牌义，可选用 AI 深度解读。纯娱乐。">
<title>Tarot</title>
<link rel="icon" href="cards/favicon.png">

<!-- 字体：花体标题 Cinzel Decorative；其余 Cormorant Garamond；中文走系统栈 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">

<link rel="stylesheet" href="css/style.css">

<!-- GSAP（UMD 全局） -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<!-- Three.js：importmap，零构建 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<!-- Layer 0：WebGL 画布（粒子星云 / 3D 卡牌都在这一个 canvas 里） -->
<div id="gl" class="gl-layer" aria-hidden="true"></div>

<!-- WebGL 不可用时的友好提示 -->
<div id="glNotice" class="gl-notice" hidden>
  <p class="gl-notice-title">你的浏览器暂不支持 3D 渲染</p>
  <p class="gl-notice-text">页面已切换为简洁模式，功能完全正常。</p>
</div>

<noscript>
  <div class="gl-notice">
    <p class="gl-notice-title">需要开启 JavaScript</p>
    <p class="gl-notice-text">本页依赖 JavaScript，请在浏览器设置中开启后刷新。</p>
  </div>
</noscript>

<!-- 标题淡出后散开的星光：一块 canvas，空闲时 display:none，不占合成开销 -->
<canvas id="burstLayer" class="burst-layer" aria-hidden="true"></canvas>

<!-- 牌背点击区：canvas 是 pointer-events:none，所以用透明按钮对齐到 3D 牌背；
     无 3D 时同一元素直接显示牌背图，交互保持一致 -->
<button id="deckHit" class="deck-hit" type="button" aria-label="展开牌阵" hidden>
  <img class="deck-hit-img" src="cards/back.jpg" alt="">
</button>

<!-- 牌位标签浮层（后续批次抽牌用，本次保留不动） -->
<div id="stageOverlay" class="stage-overlay" aria-hidden="true">
  <div class="slot-label" data-slot="0">
    <span class="slot-pos">过去</span>
    <span class="slot-name"></span>
    <span class="slot-badge"></span>
  </div>
  <div class="slot-label" data-slot="1">
    <span class="slot-pos">现在</span>
    <span class="slot-name"></span>
    <span class="slot-badge"></span>
  </div>
  <div class="slot-label" data-slot="2">
    <span class="slot-pos">未来</span>
    <span class="slot-name"></span>
    <span class="slot-badge"></span>
  </div>
</div>

<!-- ===== 开场 ===== -->
<header class="opening" id="opening">
  <!-- 0. 顶部光球展示区（最多 3 个，居中对称；从左到右：最旧 → 最新）
       数据由 app.js 的 renderOrbs() 注入；本批次只做静态展示 + 最旧那颗呼吸 -->
  <div class="opening-orbs" id="orbRow" data-count="0" hidden></div>

  <!-- 1. 顶部花体标题（点击牌背后爆散成星光，不再回来） -->
  <h1 class="opening-title" id="openingTitle">Tarot</h1>

  <!-- 4. 神秘问句 -->
  <p class="opening-question" id="openingQuestion">Whisper your question…</p>

  <!-- 5. 无框输入框 -->
  <div class="opening-field">
    <input id="question" class="opening-input" type="text" maxlength="200"
      autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="你想问什么">
  </div>

  <!-- 6. 传统提示（英文两行居中；纯提示，不做任何技术限制） -->
  <p class="opening-hint">
    <span>Ask once, ask true.</span>
    <span>Ask twice, the cards lie.</span>
  </p>

  <!-- 7. 泛涟漪光圈（空态暗且静止，有字后变亮并缓慢扩散） -->
  <button id="ringBtn" class="opening-ring" type="button" aria-label="开始解读">
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
  </button>

  <p id="drawHint" class="opening-error"></p>
</header>

<!-- ===== 3D 舞台（后续批次抽牌用，本次保留不动） ===== -->
<section class="stage" id="stage" aria-label="牌阵">
  <div class="stage-action">
    <button id="drawBtn2" class="btn-primary btn-compact" type="button">再 抽 一 次</button>
  </div>
</section>

<!-- ===== 牌义 ===== -->
<main class="reading" id="reading">
  <div class="section-rule"></div>
  <div class="reading-grid" id="readingGrid"></div>
</main>

<!-- ===== AI 解读 ===== -->
<section class="ai" id="aiSection">
  <div class="section-rule"></div>
  <div class="ai-card">
    <p class="ai-question" hidden><span id="aiQuestionEcho" class="ai-question-text"></span></p>
    <div class="ai-meta">
      <button id="aiBtn" class="btn-secondary" type="button" disabled>AI 解 读</button>
    </div>
    <div id="aiOut" class="ai-out" aria-live="polite"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-rule"></div>
</footer>

<!-- 数据层：保持既有的全局变量形式（先于模块执行） -->
<script src="js/data.js"></script>
<script src="data/meanings.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
