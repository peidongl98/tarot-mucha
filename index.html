<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="description" content="Mucha Tarot — draw three cards and see past, present and future. 78 public-domain meanings, optional AI reading in English and Chinese. For entertainment only.">
<title>Tarot</title>
<link rel="icon" href="cards/favicon.png">

<!-- 字体：花体标题 Cinzel Decorative；其余 Cormorant Garamond；中文走系统栈 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap">

<link rel="stylesheet" href="css/style.css">

<!-- GSAP（UMD 全局） -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<!-- Three.js：importmap，零构建 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<!-- Layer 0：WebGL 画布（粒子星云 / 3D 卡牌都在这一个 canvas 里） -->
<div id="gl" class="gl-layer" aria-hidden="true"></div>

<!-- WebGL 不可用时的友好提示 -->
<div id="glNotice" class="gl-notice" hidden>
  <p class="gl-notice-title">3D rendering is not available in this browser</p>
  <p class="gl-notice-text">Switched to the simple mode. Everything still works.</p>
</div>

<noscript>
  <div class="gl-notice">
    <p class="gl-notice-title">JavaScript is required</p>
    <p class="gl-notice-text">Enable JavaScript in your browser settings and refresh.</p>
  </div>
</noscript>

<!-- 星光层：一块 canvas，空闲时 display:none -->
<canvas id="burstLayer" class="burst-layer" aria-hidden="true"></canvas>

<!-- 牌背点击区：canvas 是 pointer-events:none，所以用透明按钮对齐到 3D 牌背 -->
<button id="deckHit" class="deck-hit" type="button" aria-label="Spread the cards" hidden>
  <img class="deck-hit-img" src="cards/back.jpg" alt="">
</button>

<!-- 三张牌的点击区（每帧对齐 3D 投影） -->
<button id="hit0" class="card-hit" type="button" aria-label="Past" hidden></button>
<button id="hit1" class="card-hit" type="button" aria-label="Present" hidden></button>
<button id="hit2" class="card-hit" type="button" aria-label="Future" hidden></button>

<!-- 滚筒切换：左右发光三角形（点击换牌；无拖动） -->
<button id="wheelPrev" class="wheel-nav wheel-nav-l" type="button" aria-label="Previous card">
  <svg viewBox="0 0 24 40" aria-hidden="true"><polygon points="19,3 5,20 19,37" /></svg>
</button>
<button id="wheelNext" class="wheel-nav wheel-nav-r" type="button" aria-label="Next card">
  <svg viewBox="0 0 24 40" aria-hidden="true"><polygon points="5,3 19,20 5,37" /></svg>
</button>

<!-- 放大态：牌上方的金色身份文字（过去 / 现在 / 未来） -->
<p class="zoom-label" id="zoomLabel" aria-hidden="true"></p>

<!-- 牌义：放大某张牌时浮出 —— 英文在前、中文在后，与解读同款排版；无框线 -->
<section class="card-read" id="cardRead" aria-live="polite"></section>

<!-- Sink：三张全翻开后浮现的底部涟漪光圈（点击进入解读） -->
<div class="sink-zone" id="sinkZone">
  <p class="sink-label" aria-hidden="true">Sink</p>
  <button id="sinkRing" class="sink-ring" type="button" aria-label="Sink — begin the reading">
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
  </button>
</div>

<!-- 滚筒居中标签：某张牌转到中央时淡入（牌上方固定位置，不随牌浮动） -->
<p class="wheel-label" id="wheelLabel" aria-hidden="true"></p>

<!-- 解读视图：标题 + 独立滚动区 + 光圈 + 返回光球 -->
<section class="reading-view" id="readingView">
  <h2 class="ai-title" aria-hidden="true">The Voice Within</h2>
  <button id="aiRing" class="ai-ring" type="button" aria-label="Begin the reading">
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
  </button>
  <div class="ai-text" id="aiText" aria-live="polite"></div>
  <p class="seal-label" aria-hidden="true">Seal</p>
  <button id="returnOrb" class="return-orb" type="button" aria-label="Hold to seal and return">
    <span class="return-orb-core"></span>
  </button>
</section>

<!-- ===== 开场 ===== -->
<header class="opening" id="opening">
  <!-- 0. 顶部光球展示区（最多 3 个，居中对称；从左到右：最旧 → 最新） -->
  <div class="opening-orbs" id="orbRow" data-count="0" hidden></div>
  <div class="orb-delete-arc" id="orbDeleteArc" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <circle class="arc-line arc-a" cx="50" cy="50" r="46" />
      <circle class="arc-line arc-b" cx="50" cy="50" r="38" />
    </svg>
  </div>

  <!-- 1. 花体标题（点击牌背后淡出，返回开场时重新出现） -->
  <h1 class="opening-title" id="openingTitle">Tarot</h1>

  <!-- 2+3+5+4. 提问聚簇：问句 → 输入框 → 泛涟漪光圈 → 传统提示。
       全部由 flex 纵向排布、间距统一由 gap 控制，
       因此输入 1 / 2 / 3 行（乃至缩到最小字号）都不可能压到问句或提示。 -->
  <div class="ask-cluster" id="askCluster">
    <!-- 2. 神秘问句 -->
    <p class="opening-question" id="openingQuestion">Whisper your question…</p>

    <!-- 3. 无框输入区（textarea：固定三行高，超出逐步缩字号，仍放不下再滚动；下方流光） -->
    <div class="opening-field">
      <textarea id="question" class="opening-input" maxlength="200" rows="1"
        autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="你想问什么"></textarea>
      <span class="field-stream" aria-hidden="true"><i></i></span>
    </div>

    <!-- 传统提示（英文两行居中；纯提示，不做任何技术限制） -->
    <p class="opening-hint">
      <span>Ask once, ask true.</span>
      <span>Ask twice, the cards lie.</span>
    </p>

    <!-- 5. 泛涟漪光圈（空态暗且静止，有字后变亮并缓慢扩散）—— 放在聚簇最底部 -->
    <button id="ringBtn" class="opening-ring" type="button" aria-label="开始解读">
      <span class="ring-wave"></span>
      <span class="ring-wave"></span>
      <span class="ring-wave"></span>
    </button>
  </div>

  <p id="drawHint" class="opening-error"></p>
</header>

<!-- 数据层：保持既有的全局变量形式（先于模块执行） -->
<script src="js/data.js"></script>
<script src="data/meanings.js"></script>
<script src="data/meanings.en.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
