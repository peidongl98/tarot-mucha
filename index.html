<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="description" content="Mucha Tarot · 抽三张牌，看见过去、现在与未来。内置 78 张公版牌义，可选用 AI 深度解读。纯娱乐。">
<title>Mucha Tarot</title>
<link rel="icon" href="cards/favicon.png">

<!-- 字体：花体英文标题 Cinzel Decorative；其余 Cormorant Garamond；中文走系统栈 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap">

<link rel="stylesheet" href="css/style.css">

<!-- GSAP（UMD 全局） -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<!-- Three.js：importmap，零构建 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<!-- Layer 0：WebGL 画布容器（fixed 铺满，粒子星云 / 输入框雾气 / 3D 卡牌都渲染在这一个 canvas 里） -->
<div id="gl" class="gl-layer" aria-hidden="true"></div>

<!-- WebGL 不可用时的友好提示 -->
<div id="glNotice" class="gl-notice" hidden>
  <p class="gl-notice-title">你的浏览器暂不支持 3D 渲染</p>
  <p class="gl-notice-text">页面已切换为简洁模式，抽牌与牌义功能完全正常。</p>
</div>

<noscript>
  <div class="gl-notice">
    <p class="gl-notice-title">需要开启 JavaScript</p>
    <p class="gl-notice-text">抽牌功能依赖 JavaScript，请在浏览器设置中开启后刷新。</p>
  </div>
</noscript>

<!-- 牌位标签浮层：固定在视口上，按 3D 投影对齐三张牌 -->
<div id="stageOverlay" class="stage-overlay" aria-hidden="true">
  <div class="slot-label" data-slot="0">
    <span class="slot-pos">过去</span>
    <span class="slot-name"></span>
    <span class="slot-badge"></span>
  </div>
  <div class="slot-label" data-slot="1">
    <span class="slot-pos">现在</span>
    <span class="slot-name"></span>
    <span class="slot-badge"></span>
  </div>
  <div class="slot-label" data-slot="2">
    <span class="slot-pos">未来</span>
    <span class="slot-name"></span>
    <span class="slot-badge"></span>
  </div>
</div>

<!-- ===== 首屏 ===== -->
<header class="hero" id="hero">
  <h1 class="hero-title anim-hero">
    <span class="wordmark-line">Mucha</span>
    <span class="wordmark-line">Tarot</span>
  </h1>
  <div class="hero-rule anim-hero"></div>

  <!-- 提问前移：问题在抽牌前输入，抽牌后带着问题进入后续解读 -->
  <div class="hero-question anim-hero">
    <textarea id="question" class="ai-input" rows="2" maxlength="200"
      placeholder="你想问什么？" aria-label="你想问什么"></textarea>
    <p class="question-hint">同一件事短期内不宜反复占卜，牌象会失真。</p>
  </div>

  <div class="hero-actions anim-hero">
    <button id="drawBtn" class="btn-primary" type="button">开 始 抽 牌</button>
  </div>
  <!-- 仅在数据加载失败等异常时写入内容，正常时为空 -->
  <p id="drawHint" class="hero-hint anim-hero"></p>
</header>

<!-- ===== 3D 舞台（DOM 基本留空，让 3D 卡牌透出） ===== -->
<section class="stage" id="stage" aria-label="牌阵">
  <div class="stage-action">
    <button id="drawBtn2" class="btn-primary btn-compact" type="button">再 抽 一 次</button>
  </div>
</section>

<!-- ===== 牌义 ===== -->
<main class="reading" id="reading">
  <div class="section-rule"></div>
  <div class="reading-grid" id="readingGrid"></div>
</main>

<!-- ===== AI 解读 ===== -->
<section class="ai" id="aiSection">
  <div class="section-rule"></div>
  <div class="ai-card">
    <!-- 输入框在首屏，这里只回显将被使用的问题；没填则不显示 -->
    <p class="ai-question" hidden><span id="aiQuestionEcho" class="ai-question-text"></span></p>
    <div class="ai-meta">
      <button id="aiBtn" class="btn-secondary" type="button" disabled>AI 解 读</button>
    </div>
    <div id="aiOut" class="ai-out" aria-live="polite"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-rule"></div>
</footer>

<!-- 数据层：保持既有的全局变量形式（先于模块执行） -->
<script src="js/data.js"></script>
<script src="data/meanings.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
