<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14101a">
<meta name="description" content="穆夏塔罗 · 在线抽三张牌（过去 / 现在 / 未来），内置 78 张公版牌义。纯娱乐。">
<title>穆夏塔罗 · 过去 现在 未来</title>
<link rel="icon" href="cards/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-title">穆夏塔罗</h1>
  <p class="site-sub">静心默念你的问题，然后抽三张牌</p>
  <p class="site-positions"><span>过去</span><i>·</i><span>现在</span><i>·</i><span>未来</span></p>
</header>

<main class="wrap">

  <section class="draw-panel">
    <button id="drawBtn" class="draw-btn" type="button">抽 牌</button>
    <p id="drawHint" class="draw-hint">78 张牌，正逆位随机</p>
  </section>

  <section id="result" class="result" aria-live="polite">
    <!-- 结果由 js/app.js 渲染 -->
    <div class="placeholder" id="placeholder">
      <p>还没有抽牌</p>
      <p class="placeholder-sub">点击上方「抽牌」开始</p>
    </div>
  </section>

  <section class="history-panel">
    <div class="history-head">
      <h2>抽牌记录</h2>
      <button id="clearBtn" class="clear-btn" type="button">清空</button>
    </div>
    <div id="historyList" class="history-list">
      <p class="history-empty">暂无记录</p>
    </div>
    <p class="history-note">记录仅保存在本机浏览器，不会上传。</p>
  </section>

</main>

<footer class="site-footer">
  <p>牌义为 Rider-Waite-Smith 体系公版内容，仅供娱乐与自我反思，不构成任何专业建议。</p>
  <p class="footer-dim">不收集任何个人信息 · 无需登录</p>
</footer>

<script src="js/data.js"></script>
<script src="data/meanings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
