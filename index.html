<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="description" content="Mucha Tarot · 抽三张牌，看见过去、现在与未来。内置 78 张公版牌义，可选用 AI 深度解读。纯娱乐。">
<title>Tarot</title>
<link rel="icon" href="cards/favicon.png">

<!-- 字体：花体标题 Cinzel Decorative；其余 Cormorant Garamond；中文走系统栈 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">

<link rel="stylesheet" href="css/style.css">

<!-- GSAP（UMD 全局） -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<!-- Three.js：importmap，零构建 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<!-- Layer 0：WebGL 画布（粒子星云 / 3D 卡牌都在这一个 canvas 里） -->
<div id="gl" class="gl-layer" aria-hidden="true"></div>

<!-- WebGL 不可用时的友好提示 -->
<div id="glNotice" class="gl-notice" hidden>
  <p class="gl-notice-title">你的浏览器暂不支持 3D 渲染</p>
  <p class="gl-notice-text">页面已切换为简洁模式，功能完全正常。</p>
</div>

<noscript>
  <div class="gl-notice">
    <p class="gl-notice-title">需要开启 JavaScript</p>
    <p class="gl-notice-text">本页依赖 JavaScript，请在浏览器设置中开启后刷新。</p>
  </div>
</noscript>

<!-- 星光层：一块 canvas，空闲时 display:none -->
<canvas id="burstLayer" class="burst-layer" aria-hidden="true"></canvas>

<!-- 牌背点击区：canvas 是 pointer-events:none，所以用透明按钮对齐到 3D 牌背 -->
<button id="deckHit" class="deck-hit" type="button" aria-label="展开牌阵" hidden>
  <img class="deck-hit-img" src="cards/back.jpg" alt="">
</button>

<!-- 三张牌的点击区（每帧对齐 3D 投影） -->
<button id="hit0" class="card-hit" type="button" aria-label="第一张牌" hidden></button>
<button id="hit1" class="card-hit" type="button" aria-label="第二张牌" hidden></button>
<button id="hit2" class="card-hit" type="button" aria-label="第三张牌" hidden></button>

<!-- 放大态：牌上方的金色身份文字（过去 / 现在 / 未来） -->
<p class="zoom-label" id="zoomLabel" aria-hidden="true"></p>

<!-- 牌义：放大某张牌时浮出（只有文字，没有框线） -->
<section class="card-read" id="cardRead" aria-live="polite">
  <h2 class="read-name" id="readName"></h2>
  <p class="read-badge" id="readBadge"></p>
  <p class="read-keys" id="readKeys"></p>
  <p class="read-text" id="readText"></p>
</section>

<!-- 上滑引导：一条向上流动的星光 -->
<div class="star-hint" id="starHint" aria-hidden="true"></div>

<!-- 滚动提示：与星光引导同时出现 -->
<p class="scroll-hint" id="scrollHint" aria-hidden="true">Scroll, and the veil shall part.</p>

<!-- 滚筒居中标签：某张牌转到中央时淡入（牌上方固定位置，不随牌浮动） -->
<p class="wheel-label" id="wheelLabel" aria-hidden="true"></p>

<!-- 解读视图：光圈 + 解读文字 + 返回光球 -->
<section class="reading-view" id="readingView">
  <button id="aiRing" class="ai-ring" type="button" aria-label="开始解读">
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
  </button>
  <div class="ai-text" id="aiText" aria-live="polite"></div>
  <button id="returnOrb" class="return-orb" type="button" aria-label="保存并返回">
    <span class="return-orb-core"></span>
  </button>
</section>

<!-- ===== 开场 ===== -->
<header class="opening" id="opening">
  <!-- 0. 顶部光球展示区（最多 3 个，居中对称；从左到右：最旧 → 最新） -->
  <div class="opening-orbs" id="orbRow" data-count="0" hidden></div>

  <!-- 1. 花体标题（点击牌背后淡出，返回开场时重新出现） -->
  <h1 class="opening-title" id="openingTitle">Tarot</h1>

  <!-- 2. 神秘问句 -->
  <p class="opening-question" id="openingQuestion">Whisper your question…</p>

  <!-- 3. 无框输入框 -->
  <div class="opening-field">
    <input id="question" class="opening-input" type="text" maxlength="200"
      autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="你想问什么">
  </div>

  <!-- 4. 传统提示（英文两行居中；纯提示，不做任何技术限制） -->
  <p class="opening-hint">
    <span>Ask once, ask true.</span>
    <span>Ask twice, the cards lie.</span>
  </p>

  <!-- 5. 泛涟漪光圈（空态暗且静止，有字后变亮并缓慢扩散） -->
  <button id="ringBtn" class="opening-ring" type="button" aria-label="开始解读">
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
    <span class="ring-wave"></span>
  </button>

  <p id="drawHint" class="opening-error"></p>
</header>

<!-- 数据层：保持既有的全局变量形式（先于模块执行） -->
<script src="js/data.js"></script>
<script src="data/meanings.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
