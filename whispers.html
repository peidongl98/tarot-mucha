<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060A">
<title>Whispers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse 120% 100% at 50% 42%, #15110f 0%, #0a0807 55%, #050406 100%);
    overflow: hidden;
    position: fixed;
    inset: 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
  }
  #scene { display: block; width: 100%; height: 100%; }

  .wordmark {
    position: fixed;
    top: 4.2%;
    left: 0; right: 0;
    text-align: center;
    z-index: 2;
    pointer-events: none;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(15px, 3.2vmin, 22px);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: rgba(201, 169, 97, 0.82);
    text-shadow: 0 0 18px rgba(201, 169, 97, 0.35);
  }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: 5%;
    text-align: center;
    z-index: 2;
    pointer-events: none;
    font-style: italic;
    font-size: clamp(12px, 2.4vmin, 16px);
    letter-spacing: 0.16em;
    color: rgba(138, 130, 120, 0.7);
    transition: opacity 1.1s ease;
  }
  .hint.fade { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .hint { transition: none; }
  }
</style>
</head>
<body>
  <div class="wordmark">WHISPERS</div>
  <canvas id="scene"></canvas>
  <div class="hint" id="hint">touch the orb to listen &middot; touch beyond it to release</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const hintEl = document.getElementById('hint');

  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOTION = REDUCED ? 0 : 1;

  let vw = 0, vh = 0, cx = 0, cy = 0, dpr = 1;
  let orbR = 0, orbitR = 0, FOCAL = 720;
  const INC = 26 * Math.PI / 180;        // orbit-plane tilt (low = more in/out-of-screen depth)

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth;
    vh = window.innerHeight;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = vw / 2;
    cy = vh * 0.52;
    orbR = Math.min(vw, vh) * 0.15;       // 2x larger
    orbitR = Math.min(vw, vh) * 0.44;
    FOCAL = orbitR * 1.8;                 // perspective: always > orbitR so depth never blows up
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- starfield (rotating) ----------
  const STARS = [];
  function seedStars() {
    STARS.length = 0;
    const n = Math.round((vw * vh) / 9000);
    const S = Math.max(vw, vh) * 1.15;
    for (let i = 0; i < n; i++) {
      STARS.push({
        x: (Math.random() * 2 - 1) * S,
        y: (Math.random() * 2 - 1) * S,
        z: (Math.random() * 2 - 1) * S,
        tw: Math.random() * Math.PI * 2,
        ts: 0.6 + Math.random() * 1.6
      });
    }
  }
  seedStars();
  window.addEventListener('resize', seedStars);

  let starYaw = 0;
  const TILT_X = -0.42;

  function drawStars(t) {
    const cosY = Math.cos(starYaw), sinY = Math.sin(starYaw);
    const cosX = Math.cos(TILT_X), sinX = Math.sin(TILT_X);
    for (const s of STARS) {
      const x1 = s.x * cosY + s.z * sinY;
      const z1 = -s.x * sinY + s.z * cosY;
      const y2 = s.y * cosX - z1 * sinX;
      const z2 = s.y * sinX + z1 * cosX;
      const scale = FOCAL / (FOCAL - z2);
      if (scale <= 0) continue;
      const sx = cx + x1 * scale * 0.62;
      const sy = cy + y2 * scale * 0.62;
      if (sx < -20 || sx > vw + 20 || sy < -20 || sy > vh + 20) continue;
      const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.ts + s.tw));
      const a = Math.max(0, Math.min(1, scale * 0.9)) * tw * 0.85;
      const r = Math.max(0.4, (0.5 + 1.3 * Math.abs(scale)) * 0.9);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(237,228,210,' + a.toFixed(3) + ')';
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- central orb (gentle breathing light) ----------
  function drawOrb(t) {
    const breathe = 1 + 0.05 * Math.sin(t * 0.85) * MOTION;
    const haloR = orbR * 3.0 * breathe;
    const g = ctx.createRadialGradient(cx, cy, orbR * 0.15, cx, cy, haloR);
    g.addColorStop(0, 'rgba(255,248,230,0.92)');
    g.addColorStop(0.12, 'rgba(246,224,162,' + (0.5 * breathe).toFixed(3) + ')');
    g.addColorStop(0.42, 'rgba(201,169,97,0.16)');
    g.addColorStop(1, 'rgba(201,169,97,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, haloR, 0, Math.PI * 2); ctx.fill();

    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, orbR * breathe);
    cg.addColorStop(0, 'rgba(255,253,246,1)');
    cg.addColorStop(0.55, 'rgba(255,239,202,0.92)');
    cg.addColorStop(1, 'rgba(245,208,150,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, orbR * breathe, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- whispers orbiting ----------
  // state: 'idle' (no whispers) | 'orbit' | 'scatter'
  let state = 'idle';
  let whispers = [];      // {text, theta, lines, baseSize}
  let particles = [];     // scatter light
  let loading = false;
  let interacted = false;
  const BATCH = 14;
  const ORBIT_SPEED = 0.07;   // rad/s, very slow

  function wrapText(text, maxW) {
    const tokens = text.match(/[\u3000-\u9fff\uff00-\uffef]|[A-Za-z0-9'’\-]+|\s+/g) || [text];
    const lines = [];
    let line = '';
    for (const tk of tokens) {
      const test = line + tk;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line.trim());
        line = tk.trim();
      } else {
        line = test;
      }
    }
    if (line.trim()) lines.push(line.trim());
    return lines;
  }

  function project(theta) {
    const lx = orbitR * Math.cos(theta);
    const lz = orbitR * Math.sin(theta);
    const y2 = -lz * Math.sin(INC);
    const z2 = lz * Math.cos(INC);
    return { sx: cx + lx, sy: cy + y2, depth: z2 };
  }

  function spawnWhispers(list) {
    whispers = list.map((text, i) => {
      const theta = (i / list.length) * Math.PI * 2 + Math.random() * 0.25;
      return { text, theta, life: 0 };
    });
    state = 'orbit';
  }

  function drawWhisper(w, t) {
    const p = project(w.theta);
    const scale = FOCAL / (FOCAL - p.depth);
    const base = 17 * scale;
    const maxW = Math.min(vw * 0.40, 300) * scale;
    ctx.font = 'italic ' + base.toFixed(1) + "px 'Cormorant Garamond', 'Songti SC', 'STSong', serif";
    if (!w.lines) w.lines = wrapText(w.text, maxW);
    const lh = base * 1.34;
    const alpha = Math.max(0.16, Math.min(1, 0.22 + 0.78 * ((p.depth + orbitR) / (2 * orbitR))));
    const fade = Math.min(1, w.life / 0.8);
    ctx.globalAlpha = alpha * fade;
    ctx.fillStyle = '#EDE8E0';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 10;
    const totalH = (w.lines.length - 1) * lh;
    w.lines.forEach((ln, k) => {
      ctx.fillText(ln, p.sx, p.sy - totalH / 2 + k * lh);
    });
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawOrbitLayer(t, front) {
    const arr = whispers.filter(w => front ? project(w.theta).depth >= 0 : project(w.theta).depth < 0);
    arr.sort((a, b) => project(a.theta).depth - project(b.theta).depth);
    for (const w of arr) drawWhisper(w, t);
  }

  // ---------- scatter into light ----------
  function release(x, y) {
    if (state !== 'orbit') return;
    state = 'scatter';
    for (const w of whispers) {
      const p = project(w.theta);
      const cnt = 10;
      for (let i = 0; i < cnt; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 130;
        particles.push({
          x: p.sx, y: p.sy,
          vx: Math.cos(ang) * sp + (p.sx - cx) * 0.25,
          vy: Math.sin(ang) * sp + (p.sy - cy) * 0.25,
          life: 1, decay: 0.5 + Math.random() * 0.5,
          size: 1 + Math.random() * 2.2
        });
      }
    }
    // light burst at click
    for (let i = 0; i < 18; i++) {
      const ang = (i / 18) * Math.PI * 2;
      particles.push({
        x, y, vx: Math.cos(ang) * 160, vy: Math.sin(ang) * 160,
        life: 1, decay: 0.7, size: 1.4
      });
    }
    whispers = [];
    hintEl.classList.add('fade');
  }

  function drawParticles(dt) {
    let alive = false;
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.97; p.vy *= 0.97;
      p.life -= p.decay * dt;
      if (p.life <= 0) continue;
      alive = true;
      ctx.globalAlpha = Math.max(0, p.life) * 0.9;
      ctx.fillStyle = 'rgba(247,228,176,1)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + p.life), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
    if (!alive && state === 'scatter') state = 'idle';
  }

  // ---------- draw batch ----------
  async function draw() {
    if (loading || state !== 'idle') return;
    loading = true;
    try {
      const res = await fetch('/api/whispers?n=' + BATCH, { cache: 'no-store' });
      const data = await res.json();
      const qs = (data && data.questions) || [];
      if (qs.length) spawnWhispers(qs);
    } catch (e) { /* silent */ }
    loading = false;
  }

  function fadeHint() {
    if (interacted) return;
    interacted = true;
    hintEl.classList.add('fade');
  }

  // ---------- input ----------
  function onDown(e) {
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - cx, dy = pt.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist <= orbR * 1.7) {
      // on orb
      if (state === 'idle') { fadeHint(); draw(); }
      else if (state === 'orbit') { hintEl.textContent = 'touch beyond the orb to release'; hintEl.classList.remove('fade'); }
    } else {
      // background
      if (state === 'orbit') { fadeHint(); release(pt.clientX, pt.clientY); }
    }
  }
  canvas.addEventListener('click', onDown);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    starYaw += dt * 0.02 * MOTION;

    ctx.clearRect(0, 0, vw, vh);
    drawStars(t);

    if (state === 'orbit') {
      for (const w of whispers) { w.theta += ORBIT_SPEED * dt * MOTION; w.life += dt; }
      drawOrbitLayer(t, false);   // behind the orb
      drawOrb(t);
      drawOrbitLayer(t, true);    // in front of the orb
    } else {
      drawOrb(t);
      if (state === 'scatter') drawParticles(dt);
    }

    requestAnimationFrame(frame);
  }

  // start alive: draw one batch once fonts are ready
  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    requestAnimationFrame(frame);
    draw();
  };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
    setTimeout(start, 800);        // fallback if fonts hang
  } else {
    start();
  }
})();
</script>
</body>
</html>
