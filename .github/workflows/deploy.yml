name: Deploy to Cloudflare Pages

# 推送到 main 即自动部署到 Cloudflare Pages（生产环境）
on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 同一时间只跑一个部署，新的推送不会和旧的打架
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库里 pictrues/ 已被 .gitignore 排除，因此 checkout 出来的就是待发布的站点文件，
      # 直接部署仓库根目录即可，无需额外构建步骤。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy . --project-name=tarot-mucha --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
